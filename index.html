<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unemployed - Notepad</title>
    <!-- Favicon using the custom SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23999' d='M22 6H8v20h16V6z'/%3E%3Cpath fill='%23fff' d='M20 8H10v16h12V8z'/%3E%3Cpath fill='%23000' d='M24 4H10v20h16V4z'/%3E%3Cpath fill='%23fff' d='M22 6H12v16h12V6z'/%3E%3Cpath fill='%23000' d='M26 8H12v20h16V8z'/%3E%3Cpath fill='%23fff' d='M24 10H14v16h12V10z'/%3E%3Cpath fill='%23000' d='M26 8V6h-2v2h2z'/%3E%3Cpath fill='%23999' d='M24 8V6h-2v2h2z'/%3E%3C/svg%3E">
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            /* Windows 7 Default Desktop Background */
            background: url('https://i.pinimg.com/736x/87/70/88/8770889f041e0a57569ef61a13c2f6f6.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* --- Window Container (Aero Glass) --- */
        .window {
            width: 850px;
            height: 600px;
            min-width: 400px;
            min-height: 300px;
            background-color: rgba(240, 240, 240, 0.95);
            border: 1px solid #7a7a7a;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden; /* Prevents text from spilling out when scaling */
            backdrop-filter: blur(10px);
        }

        /* --- Title Bar --- */
        .title-bar {
            height: 30px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.9) 0%, rgba(220,225,235,0.8) 100%);
            border-bottom: 1px solid rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 10px;
            cursor: default;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
            border-radius: 7px 7px 0 0;
            flex-shrink: 0; /* Prevent title bar from shrinking */
        }

        .title-bar-text {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #000;
            font-weight: 500;
            text-shadow: 0 1px 0 rgba(255,255,255,0.7);
        }
        
        .title-icon {
            width: 16px;
            height: 16px;
            margin-right: 6px;
            image-rendering: pixelated;
        }

        .window-controls {
            display: flex;
            height: 100%;
        }

        .window-controls button {
            width: 45px;
            height: 100%;
            border: none;
            background: transparent;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transition: background 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .window-controls button:hover { background: rgba(0,0,0,0.1); }
        .window-controls button.close-btn:hover { background: #e81123; color: white; }
        .window-controls svg { width: 10px; height: 10px; fill: currentColor; }

        /* --- Menu Bar --- */
        .menu-bar {
            height: 22px;
            background-color: #f0f0f0;
            border-bottom: 1px solid #d9d9d9;
            display: flex;
            font-size: 12px;
            align-items: center;
            padding: 0 5px;
            position: relative;
            z-index: 100;
            flex-shrink: 0;
        }

        .menu-item {
            padding: 2px 8px;
            cursor: default;
            border: 1px solid transparent;
            position: relative;
        }

        .menu-item:hover, .menu-item.active {
            background-color: #e5f1fb;
            border: 1px solid #99c4e8;
        }

        /* Dropdown Menus */
        .dropdown {
            display: none;
            position: absolute;
            top: 20px;
            left: 0;
            background: #f0f0f0;
            border: 1px solid #a0a0a0;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            min-width: 180px;
            z-index: 100;
            font-size: 12px;
            padding: 2px;
        }

        .menu-item.active .dropdown { display: block; }

        .dropdown-item {
            padding: 4px 20px;
            cursor: default;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dropdown-item:hover { background-color: #99c4e8; color: white; }
        .dropdown-divider { height: 1px; background-color: #d9d9d9; margin: 3px 0; }
        .shortcut { color: #888; font-size: 11px; }
        .dropdown-item:hover .shortcut { color: #fff; }

        /* --- Text Area Container --- */
        .text-container {
            flex-grow: 1;
            display: flex;
            background-color: #fff;
            position: relative;
            border-top: 1px solid #a0a0a0;
            overflow: hidden; 
        }

        textarea {
            width: 100%;
            height: 100%;
            border: none;
            resize: none;
            outline: none;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            padding: 5px;
            user-select: text;
            white-space: pre;
            overflow: auto;
        }

        textarea.wrap {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* --- Status Bar --- */
        .status-bar {
            height: 22px;
            background-color: #f0f0f0;
            border-top: 1px solid #d9d9d9;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 10px;
            font-size: 12px;
            color: #333;
            flex-shrink: 0;
            position: relative;
        }
        
        .status-bar div {
            border-left: 1px solid #d9d9d9;
            padding: 0 10px;
            height: 100%;
            display: flex;
            align-items: center;
        }

        /* Autosave Indicator */
        .autosave-text {
            color: #888;
            font-size: 11px;
            margin-left: auto; 
            padding-right: 10px;
            transition: color 0.3s;
        }
        .autosave-text.saved { color: #2e7d32; }

        /* --- Resize Handle --- */
        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 16px;
            height: 16px;
            cursor: nwse-resize;
            z-index: 1000;
            /* Draw the classic Windows diagonal lines */
            background: linear-gradient(135deg, transparent 45%, #a0a0a0 45%, #a0a0a0 55%, transparent 55%),
                        linear-gradient(135deg, transparent 65%, #a0a0a0 65%, #a0a0a0 75%, transparent 75%),
                        linear-gradient(135deg, transparent 85%, #a0a0a0 85%, #a0a0a0 95%, transparent 95%);
        }

        /* --- Dialogs (Go To) --- */
        .dialog-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.2);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .dialog-overlay.show { display: flex; }

        .dialog {
            background: #f0f0f0;
            border: 1px solid #7a7a7a;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            width: 300px;
            border-radius: 4px;
            overflow: hidden;
        }

        .dialog-title {
            height: 25px;
            background: linear-gradient(to bottom, #ffffff, #e0e0e0);
            border-bottom: 1px solid #a0a0a0;
            display: flex;
            align-items: center;
            padding-left: 10px;
            font-size: 12px;
            font-weight: 500;
        }

        .dialog-content {
            padding: 15px;
            font-size: 12px;
        }

        .dialog-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .dialog-row label { margin-right: 10px; }
        .dialog-row input { 
            flex-grow: 1; 
            padding: 3px; 
            border: 1px solid #a0a0a0; 
            font-family: inherit;
        }

        .dialog-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 10px 15px;
            background: #f0f0f0;
            border-top: 1px solid #d9d9d9;
        }

        .dialog-buttons button {
            padding: 4px 15px;
            font-size: 12px;
            background: linear-gradient(to bottom, #f0f0f0, #dcdcdc);
            border: 1px solid #a0a0a0;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .dialog-buttons button:hover { background: #e5f1fb; border-color: #99c4e8; }
    </style>
</head>
<body>

    <input type="file" id="fileInput" accept=".txt" style="display: none;">

    <div class="window" id="mainWindow">
        <!-- Title Bar -->
        <div class="title-bar" id="dragWindow">
            <div class="title-bar-text" id="windowTitle">
                <svg class="title-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#999" d="M22 6H8v20h16V6z"/>
                    <path fill="#fff" d="M20 8H10v16h12V8z"/>
                    <path fill="#000" d="M24 4H10v20h16V4z"/>
                    <path fill="#fff" d="M22 6H12v16h12V6z"/>
                    <path fill="#000" d="M26 8H12v20h16V8z"/>
                    <path fill="#fff" d="M24 10H14v16h12V10z"/>
                    <path fill="#000" d="M26 8V6h-2v2h2z"/>
                    <path fill="#999" d="M24 8V6h-2v2h2z"/>
                </svg>
                Untitled - Notepad
            </div>
            <div class="window-controls">
                <button title="Minimize"><svg viewBox="0 0 10 10"><path d="M0 9h10v1H0z"/></svg></button>
                <button title="Maximize"><svg viewBox="0 0 10 10"><path d="M0 0h10v10H0V0zm1 1v8h8V1H1z"/></svg></button>
                <button class="close-btn" title="Close" onclick="window.close()"><svg viewBox="0 0 10 10"><path d="M1 0l4 4 4-4 1 1-4 4 4 4-1 1-4-4-4 4-1-1 4-4-4-4z"/></svg></button>
            </div>
        </div>

        <!-- Menu Bar -->
        <div class="menu-bar">
            <div class="menu-item" onclick="toggleMenu(this)">File
                <div class="dropdown">
                    <div class="dropdown-item" onclick="newFile()">New <span class="shortcut">Ctrl+N</span></div>
                    <div class="dropdown-item" onclick="document.getElementById('fileInput').click()">Open... <span class="shortcut">Ctrl+O</span></div>
                    <div class="dropdown-item" onclick="saveFile()">Save <span class="shortcut">Ctrl+S</span></div>
                    <div class="dropdown-item" onclick="saveFileAs()">Save As...</div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" onclick="window.close()">Exit</div>
                </div>
            </div>
            <div class="menu-item" onclick="toggleMenu(this)">Edit
                <div class="dropdown">
                    <div class="dropdown-item" onclick="document.execCommand('undo')">Undo <span class="shortcut">Ctrl+Z</span></div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" onclick="document.execCommand('cut')">Cut <span class="shortcut">Ctrl+X</span></div>
                    <div class="dropdown-item" onclick="document.execCommand('copy')">Copy <span class="shortcut">Ctrl+C</span></div>
                    <div class="dropdown-item" onclick="document.execCommand('paste')">Paste <span class="shortcut">Ctrl+V</span></div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" onclick="document.execCommand('selectAll')">Select All <span class="shortcut">Ctrl+A</span></div>
                    <div class="dropdown-item" onclick="showGoTo()">Go To... <span class="shortcut">Ctrl+G</span></div>
                </div>
            </div>
            <div class="menu-item" onclick="toggleMenu(this)">Format
                <div class="dropdown">
                    <div class="dropdown-item" onclick="toggleWordWrap()">Word Wrap <span id="wrapCheck"></span></div>
                </div>
            </div>
            <div class="menu-item" onclick="toggleMenu(this)">View
                <div class="dropdown">
                    <div class="dropdown-item">Zoom</div>
                </div>
            </div>
            <div class="menu-item" onclick="toggleMenu(this)">Help</div>
        </div>

        <div class="text-container">
            <textarea id="notepadText" spellcheck="false"></textarea>
        </div>

        <div class="status-bar">
            <div class="autosave-text" id="autosaveStatus">Auto-saved</div>
            <div id="statusLine">Ln 1, Col 1</div>
            <div id="charCount">0 characters</div>
            <div>100%</div>
            <!-- The Resize Handle -->
            <div class="resize-handle" id="resizeHandle"></div>
        </div>

        <!-- Go To Dialog -->
        <div class="dialog-overlay" id="goToDialog">
            <div class="dialog">
                <div class="dialog-title">Go To Line</div>
                <div class="dialog-content">
                    <div class="dialog-row">
                        <label for="lineNumber">Line number:</label>
                        <input type="number" id="lineNumber" min="1" value="1">
                    </div>
                </div>
                <div class="dialog-buttons">
                    <button onclick="goToLine()">Go To</button>
                    <button onclick="closeDialog('goToDialog')">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Elements ---
        const textarea = document.getElementById('notepadText');
        const fileInput = document.getElementById('fileInput');
        const windowTitle = document.getElementById('windowTitle');
        const charCountEl = document.getElementById('charCount');
        const statusLineEl = document.getElementById('statusLine');
        const autosaveStatus = document.getElementById('autosaveStatus');
        const windowEl = document.getElementById('mainWindow');
        const resizeHandle = document.getElementById('resizeHandle');
        let isWordWrap = false;

        // --- Scaling / Resize Logic ---
        let isResizing = false;
        let startWidth, startHeight, startX, startY;

        resizeHandle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            isResizing = true;
            startX = e.clientX;
            startY = e.clientY;
            startWidth = windowEl.offsetWidth;
            startHeight = windowEl.offsetHeight;
            
            // Add event listeners to the whole document to handle fast mouse movement
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });

        function onMouseMove(e) {
            if (!isResizing) return;
            
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            
            // Calculate new dimensions, enforcing minimums
            const newWidth = Math.max(400, startWidth + dx);
            const newHeight = Math.max(300, startHeight + dy);
            
            // Apply new dimensions
            windowEl.style.width = `${newWidth}px`;
            windowEl.style.height = `${newHeight}px`;
        }

        function onMouseUp() {
            isResizing = false;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }

        // --- Auto-Save Logic (localStorage) ---
        const STORAGE_KEY = 'win7_notepad_content';
        let saveTimeout;

        function loadFromStorage() {
            const savedText = localStorage.getItem(STORAGE_KEY);
            if (savedText !== null) {
                textarea.value = savedText;
                updateStats();
            }
        }

        function saveToStorage() {
            autosaveStatus.textContent = "Saving...";
            autosaveStatus.classList.remove('saved');
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem(STORAGE_KEY, textarea.value);
                autosaveStatus.textContent = "Auto-saved";
                autosaveStatus.classList.add('saved');
            }, 500);
        }

        // --- Text Logic ---
        function updateStats() {
            charCountEl.textContent = `${textarea.value.length} characters`;
            
            const text = textarea.value;
            const pos = textarea.selectionStart;
            const lines = text.substring(0, pos).split('\n');
            const currentLine = lines.length;
            const currentCol = lines[lines.length - 1].length + 1;
            statusLineEl.textContent = `Ln ${currentLine}, Col ${currentCol}`;
        }

        textarea.addEventListener('input', () => {
            updateStats();
            saveToStorage();
        });
        
        textarea.addEventListener('click', updateStats);
        textarea.addEventListener('keyup', updateStats);

        window.addEventListener('DOMContentLoaded', loadFromStorage);

        // --- File Operations ---
        function saveFile() {
            const blob = new Blob([textarea.value], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Untitled.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function saveFileAs() {
            const newName = prompt('Enter file name:', 'Untitled.txt');
            if (!newName) return;
            
            const blob = new Blob([textarea.value], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = newName.endsWith('.txt') ? newName : newName + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            updateTitle(a.download);
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                textarea.value = ev.target.result;
                updateStats();
                saveToStorage();
                updateTitle(file.name);
            };
            reader.readAsText(file);
            fileInput.value = '';
        });

        function newFile() {
            if (textarea.value.trim() !== '') {
                if (!confirm('Do you want to save changes to Untitled?')) {
                    textarea.value = '';
                    localStorage.removeItem(STORAGE_KEY);
                    autosaveStatus.textContent = "Auto-saved";
                } else {
                    saveFile();
                    textarea.value = '';
                    localStorage.removeItem(STORAGE_KEY);
                    autosaveStatus.textContent = "Auto-saved";
                }
            } else {
                textarea.value = '';
                localStorage.removeItem(STORAGE_KEY);
            }
            updateTitle('Untitled');
            updateStats();
        }

        function updateTitle(filename) {
            windowTitle.innerHTML = `
                <svg class="title-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#999" d="M22 6H8v20h16V6z"/>
                    <path fill="#fff" d="M20 8H10v16h12V8z"/>
                    <path fill="#000" d="M24 4H10v20h16V4z"/>
                    <path fill="#fff" d="M22 6H12v16h12V6z"/>
                    <path fill="#000" d="M26 8H12v20h16V8z"/>
                    <path fill="#fff" d="M24 10H14v16h12V10z"/>
                    <path fill="#000" d="M26 8V6h-2v2h2z"/>
                    <path fill="#999" d="M24 8V6h-2v2h2z"/>
                </svg>
                ${filename} - Notepad`;
        }

        // --- Format Logic ---
        function toggleWordWrap() {
            isWordWrap = !isWordWrap;
            textarea.classList.toggle('wrap', isWordWrap);
            document.getElementById('wrapCheck').textContent = isWordWrap ? '✓' : '';
            closeMenus();
        }

        // --- Menu Logic ---
        function toggleMenu(clickedItem) {
            const isActive = clickedItem.classList.contains('active');
            closeMenus(); 
            if (!isActive) clickedItem.classList.add('active');
        }

        function closeMenus() {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.menu-item')) closeMenus();
        });

        // --- Go To Dialog ---
        function showGoTo() {
            closeMenus();
            document.getElementById('goToDialog').classList.add('show');
            document.getElementById('lineNumber').focus();
        }

        function closeDialog(id) {
            document.getElementById(id).classList.remove('show');
        }

        function goToLine() {
            const lineNum = parseInt(document.getElementById('lineNumber').value);
            if (isNaN(lineNum) || lineNum < 1) return;

            const lines = textarea.value.split('\n');
            let charIndex = 0;
            for (let i = 0; i < lineNum - 1; i++) {
                if (i < lines.length) {
                    charIndex += lines[i].length + 1;
                }
            }
            
            textarea.focus();
            textarea.setSelectionRange(charIndex, charIndex);
            updateStats();
            closeDialog('goToDialog');
        }

        // --- Keyboard Shortcuts ---
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveFile(); }
            if (e.ctrlKey && e.key === 'o') { e.preventDefault(); fileInput.click(); }
            if (e.ctrlKey && e.key === 'n') { e.preventDefault(); newFile(); }
            if (e.ctrlKey && e.key === 'g') { e.preventDefault(); showGoTo(); }
        });

        // Close dialog on enter
        document.getElementById('lineNumber').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') goToLine();
        });

    </script>
</body>
</html>
